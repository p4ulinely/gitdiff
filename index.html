<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Git Diff Viewer</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M5 3.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm0 2.122a2.25 2.25 0 1 0-1.5 0v5.256a2.25 2.25 0 1 0 1.5 0V9.5h3.75a2.75 2.75 0 0 0 2.75-2.75v-1.378a2.25 2.25 0 1 0-1.5 0v1.378c0 .69-.56 1.25-1.25 1.25H5ZM4.25 12a.75.75 0 1 1 0 1.5.75.75 0 0 1 0-1.5Zm6.5-8.75a.75.75 0 1 1 1.5 0 .75.75 0 0 1-1.5 0Z"/></svg>
      <span>gitdiff</span>
    </div>

    <button id="pickBtn" class="btn primary" data-i18n="toolbar.openFolder"></button>
    <button id="reopenBtn" class="btn" hidden></button>
    <input id="dirInput" type="file" webkitdirectory hidden>

    <div class="repo-info" id="repoInfo" hidden>
      <span class="repo-name" id="repoName"></span>
      <button id="reloadBtn" class="icon-btn" data-i18n-attr="title:toolbar.reload">⟳</button>
    </div>

    <label class="field">
      <span data-i18n="toolbar.branch"></span>
      <select id="branchSelect" disabled></select>
    </label>

    <form id="hashForm" class="hash-form">
      <input id="hashInput" type="text" data-i18n-attr="placeholder:toolbar.hashPlaceholder" autocomplete="off" spellcheck="false" disabled>
      <button id="hashBtn" class="btn" disabled data-i18n="toolbar.go"></button>
    </form>

    <div class="spacer"></div>
    <span id="status" class="status" aria-live="polite"></span>

    <div class="seg" id="viewToggle" role="group" data-i18n-attr="aria-label:toolbar.viewMode">
      <button data-view="unified" data-i18n="toolbar.unified"></button>
      <button data-view="split" data-i18n="toolbar.split"></button>
    </div>

    <select id="localeSelect" class="locale-select" data-i18n-attr="title:toolbar.language;aria-label:toolbar.language"></select>
  </header>

  <main class="layout">
    <aside class="panel" id="commitsPanel">
      <div class="panel-head">
        <button class="icon-btn chevron" data-collapse="commitsPanel" data-i18n-attr="title:panels.toggle">‹</button>
        <h2><span data-i18n="panels.commits"></span> <span class="count" id="commitCount"></span></h2>
      </div>
      <div class="panel-tools">
        <input type="search" id="commitFilter" data-i18n-attr="placeholder:panels.commitFilter">
      </div>
      <div class="panel-body" id="commitScroll">
        <ul class="commit-list" id="commitList"></ul>
        <button id="loadMore" class="btn load-more" hidden data-i18n="panels.loadMore"></button>
      </div>
    </aside>
    <div class="resizer" data-target="commitsPanel"></div>

    <aside class="panel" id="filesPanel">
      <div class="panel-head">
        <button class="icon-btn chevron" data-collapse="filesPanel" data-i18n-attr="title:panels.toggle">‹</button>
        <h2><span data-i18n="panels.files"></span> <span class="count" id="fileCount"></span></h2>
      </div>
      <div class="panel-tools">
        <input type="search" id="fileFilter" data-i18n-attr="placeholder:panels.fileFilter">
        <div class="seg small" id="fileModeToggle" role="group" data-i18n-attr="aria-label:panels.listMode">
          <button data-mode="list" data-i18n="panels.list"></button>
          <button data-mode="tree" data-i18n="panels.tree" data-i18n-attr="title:panels.treeTitle"></button>
        </div>
      </div>
      <div class="panel-body">
        <ul class="file-list" id="fileList"></ul>
      </div>
    </aside>
    <div class="resizer" data-target="filesPanel"></div>

    <section class="diff-pane" id="diffPane">
      <div id="commitHeader" class="commit-header" hidden></div>
      <div id="diffs" class="diffs">
        <div class="welcome">
          <h1 data-i18n="welcome.title"></h1>
          <p data-i18n-html="welcome.intro"></p>
          <ul>
            <li data-i18n="welcome.local"></li>
            <li data-i18n-html="welcome.shortcuts"></li>
            <li data-i18n-html="welcome.hashTip"></li>
          </ul>
          <p class="muted" id="supportNote"></p>
        </div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" hidden></div>

  <script src="js/i18n.js"></script>
  <!-- Idiomas: para adicionar um novo, crie js/locales/<código>.js e inclua aqui. -->
  <script src="js/locales/en.js"></script>
  <script src="js/locales/pt-BR.js"></script>
  <script src="js/fs.js"></script>
  <script src="js/git.js"></script>
  <script src="js/diff.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
